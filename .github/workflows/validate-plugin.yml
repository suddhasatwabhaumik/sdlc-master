name: Validate Antigravity Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run plugin integrity and sanitization checks
        run: python3 scripts/validate_plugin.py

      - name: Build distributable plugin archive
        run: |
          chmod +x scripts/package_plugin.sh
          ./scripts/package_plugin.sh

      - name: Upload plugin archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-master-orchestrator-plugin
          path: dist/*.zip

  release:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated plugin archive
        uses: actions/download-artifact@v4
        with:
          name: sdlc-master-orchestrator-plugin
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP_FILE="$(find dist -type f -name '*.zip' -print -quit)"
          if [[ -z "${ZIP_FILE}" ]]; then
            echo "No .zip archive found in dist/" >&2
            exit 1
          fi
          EXPECTED_NAME="sdlc-master-orchestrator-${TAG_NAME}.zip"
          if [[ "$(basename "${ZIP_FILE}")" != "${EXPECTED_NAME}" ]]; then
            echo "Archive $(basename "${ZIP_FILE}") does not match tag ${TAG_NAME} (expected ${EXPECTED_NAME})" >&2
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_FILE}" --clobber --repo "${REPO}"
          else
            gh release create "${TAG_NAME}" "${ZIP_FILE}" \
              --repo "${REPO}" \
              --title "SDLC Master Orchestrator ${TAG_NAME}" \
              --generate-notes
          fi
